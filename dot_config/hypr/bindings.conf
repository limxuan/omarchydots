# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Typora, exec, uwsm-app -- typora --enable-wayland-ime
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# Debug
bind = SUPER, h, exec, bash -c "hyprctl clients > /tmp/debug.txt"

# Old SUPER app bindings (restored)
unbind = SUPER, F
bindd = SUPER, F, File manager, exec, uwsm-app -- nautilus --new-window
unbind = SUPER, T
bindd = SUPER, T, Activity, exec, omarchy-launch-tui btop
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER, M, Music, exec, omarchy-launch-or-focus spotify
bindd = SUPER, N, Editor, exec, omarchy-launch-editor
bindd = SUPER, D, Docker, exec, omarchy-launch-tui lazydocker
unbind = SUPER, O
bindd = SUPER, O, Pop window out (float & pin), exec, omarchy-hyprland-window-pop
bindd = SUPER, A, Gemini, exec, omarchy-launch-webapp "https://gemini.google.com"
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-webapp "https://claude.ai"
bindd = SUPER, Y, YouTube, exec, omarchy-launch-or-focus-webapp YouTube "https://youtube.com/"
unbind = SUPER, G
bindd = SUPER, G, Power Mode, exec, omarchy-menu power
# SUPER+C is rebound below for movefocus right
unbind = SUPER, L

# Override defaults
unbind = ALT, TAB
bindd = ALT, TAB, Find windows, exec, ~/.config/scripts/find-open-window.sh

unbind = SUPER, mouse_down
unbind = SUPER, mouse_up

unbind = SUPER, W
unbind = SUPER, S
unbind = SUPER, P
bindd = SUPER, P, Toggle workspace layout, exec, omarchy-hyprland-workspace-layout-toggle
unbind = SUPER, J
unbind = SUPER, K
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
bindd = SUPER, LEFT, Move window left, movewindow, l
bindd = SUPER, RIGHT, Move window right, movewindow, r
bindd = SUPER, UP, Move window up, movewindow, u
bindd = SUPER, DOWN, Move window down, movewindow, d
bindd = SUPER SHIFT, K, Show key bindings, exec, omarchy-menu-keybindings

# Unbind SUPER + 1..9 (and 0) workspace switching
unbind = SUPER, code:10
unbind = SUPER, code:11
unbind = SUPER, code:12
unbind = SUPER, code:13
unbind = SUPER, code:14
unbind = SUPER, code:15
unbind = SUPER, code:16
unbind = SUPER, code:17
unbind = SUPER, code:18
unbind = SUPER, code:19
unbind = SUPER, 1
unbind = SUPER, 2
unbind = SUPER, 3
unbind = SUPER, 4
unbind = SUPER, 5
unbind = SUPER, 6
unbind = SUPER, 7
unbind = SUPER, 8
unbind = SUPER, 9
unbind = SUPER, 0

# Unbind SUPER SHIFT + 1..9 (and 0) workspace window moving
unbind = SUPER SHIFT, code:10
unbind = SUPER SHIFT, code:11
unbind = SUPER SHIFT, code:12
unbind = SUPER SHIFT, code:13
unbind = SUPER SHIFT, code:14
unbind = SUPER SHIFT, code:15
unbind = SUPER SHIFT, code:16
unbind = SUPER SHIFT, code:17
unbind = SUPER SHIFT, code:18
unbind = SUPER SHIFT, code:19
unbind = SUPER SHIFT, 1
unbind = SUPER SHIFT, 2
unbind = SUPER SHIFT, 3
unbind = SUPER SHIFT, 4
unbind = SUPER SHIFT, 5
unbind = SUPER SHIFT, 6
unbind = SUPER SHIFT, 7
unbind = SUPER SHIFT, 8
unbind = SUPER SHIFT, 9
unbind = SUPER SHIFT, 0

# Caps workspace switching (CTRL+ALT+SHIFT = Caps via keyd)
bindp = CTRL|ALT|SHIFT, 1, workspace, 1
bindp = CTRL|ALT|SHIFT, 2, workspace, 2
bindp = CTRL|ALT|SHIFT, 3, workspace, 3
bindp = CTRL|ALT|SHIFT, 4, workspace, 4
bindp = CTRL|ALT|SHIFT, 5, workspace, 5
bindp = CTRL|ALT|SHIFT, 6, workspace, 6
bindp = CTRL|ALT|SHIFT, 7, workspace, 7
bindp = CTRL|ALT|SHIFT, 8, workspace, 8
bindp = CTRL|ALT|SHIFT, 9, workspace, 9
binddp = CTRL|ALT|SHIFT, w, Close active window, killactive

# Caps + X switch to workspace 6
unbind = CTRL ALT SHIFT, x
bindp = CTRL|ALT|SHIFT, x, workspace, 6

# Caps + R toggle scratchpad
unbind = CTRL ALT SHIFT, r
bindp = CTRL|ALT|SHIFT, r, togglespecialworkspace, scratchpad

# Alt + Shift + R move window to scratchpad
bindp = SHIFT|ALT, r, movetoworkspacesilent, special:scratchpad

# Screenshot utilities
unbind =, PRINT
bind = CTRL ALT SHIFT, s, exec, omarchy-capture-screenshot smart copy
bindd = , PRINT, Screenshot, exec, ~/.config/scripts/edit-clipboard-with-satty.sh

# Caps utilities
bindp = CTRL ALT SHIFT, d, exec, ~/.config/scripts/paste-clipboard.fish
bindp = CTRL ALT SHIFT, f, exec, hyprctl dispatch fullscreen 1
bindp = CTRL ALT SHIFT, space, exec, omarchy-launch-walker -m clipboard
bindp = CTRL ALT SHIFT SUPER, space, exec, omarchy-restart-walker
binddp = CTRL ALT SHIFT, t, Toggle floating, togglefloating,
binddp = CTRL ALT SHIFT, g, Toggle window grouping, togglegroup,
binddp = CTRL ALT SHIFT, b, Toggle Trackpad, exec, ~/.config/scripts/toggle-trackpad.sh
bindd = ALT, SPACE, Launch apps, exec, walker -p "Start…"

# Caps + Shift move to workspace (ALT SHIFT = Caps + Shift via keyd)
binddp = ALT SHIFT, code:10, Move window to workspace 1, movetoworkspace, 1
binddp = ALT SHIFT, code:11, Move window to workspace 2, movetoworkspace, 2
binddp = ALT SHIFT, code:12, Move window to workspace 3, movetoworkspace, 3
binddp = ALT SHIFT, code:13, Move window to workspace 4, movetoworkspace, 4
binddp = ALT SHIFT, code:14, Move window to workspace 5, movetoworkspace, 5
binddp = ALT SHIFT, code:15, Move window to workspace 6, movetoworkspace, 6
binddp = ALT SHIFT, code:16, Move window to workspace 7, movetoworkspace, 7
binddp = ALT SHIFT, code:17, Move window to workspace 8, movetoworkspace, 8
binddp = ALT SHIFT, code:18, Move window to workspace 9, movetoworkspace, 9
binddp = ALT SHIFT, code:19, Move window to workspace 10, movetoworkspace, 10
binddp = ALT SHIFT, code:20, Move window to workspace 10, movetoworkspace, 10
binddp = ALT SHIFT, X, Move to workspace 7 and back, exec, ~/.config/scripts/move-all-windows-to-primary-monitor.sh

# Caps copy/paste
bind = CTRL ALT SHIFT, C, sendshortcut, CTRL, Insert, activewindow
bind = CTRL ALT SHIFT, V, sendshortcut, SHIFT, Insert, activewindow
bind = CTRL ALT SHIFT, A, sendshortcut, CTRL, A, activewindow
bindm = SUPER SHIFT, mouse:272, Resize window

# hjkl window focus (overrides defaults)
unbind = SUPER, k
bind = SUPER, h, movefocus, l
bind = SUPER, j, movefocus, d
bind = SUPER, k, movefocus, u
bind = SUPER, l, movefocus, r
unbind = SUPER, X
bind = SUPER, X, movefocus, l
bind = SUPER, C, movefocus, r

# Layout toggle (scrolling ↔ dwindle)
unbind = SUPER, SPACE
bind = SUPER, SPACE, exec, ~/.config/hypr/toggle-layout.sh

# Toggle idle lock (caffeinated)
bindd = SUPER SHIFT, I, Toggle idle lock, exec, omarchy-toggle-idle

# Caps + e toggle dictation recording (Groq Cloud Whisper)
bindd = CTRL ALT SHIFT, e, Toggle dictation, exec, ~/.config/scripts/groq-dictate.sh
