# Your input customizations (applied on top of Omarchy defaults)
# These override settings from ~/.local/share/omarchy/default/hypr/input.conf

input {
  repeat_rate = 40
  repeat_delay = 250
  numlock_by_default = true

  touchpad {
    natural_scroll = true
    clickfinger_behavior = true
    scroll_factor = 0.4
  }
}

# Scroll speed for specific terminals
windowrule = match:class (Alacritty|kitty|foot), scroll_touchpad 1.5
windowrule = match:class com.mitchellh.ghostty, scroll_touchpad 0.2
