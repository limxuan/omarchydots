# See https://wiki.hypr.land/Configuring/Basics/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Laptop internal display
monitor=eDP-1,preferred,0x0,1.2

# External Dell S2421HN (connects via HDMI or USB-C dock as DP-3)
monitor=desc:Dell Inc. DELL S2421HN BM9NQ83,preferred,0x-1080,1

# Workspace rules
workspace=1,monitor:desc:Dell Inc. DELL S2421HN BM9NQ83
workspace=2,monitor:desc:Dell Inc. DELL S2421HN BM9NQ83
workspace=3,monitor:desc:Dell Inc. DELL S2421HN BM9NQ83
workspace=4,monitor:desc:Dell Inc. DELL S2421HN BM9NQ83
workspace=5,monitor:desc:Dell Inc. DELL S2421HN BM9NQ83
workspace=6,monitor:desc:Dell Inc. DELL S2421HN BM9NQ83
workspace=7,monitor:eDP-1
